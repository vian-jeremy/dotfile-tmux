# Theme Configuration - Restored from original comprehensive setup
# Based on Oh My Tmux theme system

# Theme colors
tmux_conf_theme_colour_1='#080808'    # dark gray  
tmux_conf_theme_colour_2='#303030'    # gray
tmux_conf_theme_colour_3='#8a8a8a'    # light gray
tmux_conf_theme_colour_4='#00afff'    # light blue
tmux_conf_theme_colour_5='#ffff00'    # yellow
tmux_conf_theme_colour_6='#080808'    # dark gray
tmux_conf_theme_colour_7='#e4e4e4'    # white
tmux_conf_theme_colour_8='#080808'    # dark gray
tmux_conf_theme_colour_9='#ffff00'    # yellow
tmux_conf_theme_colour_10='#ff00af'   # pink
tmux_conf_theme_colour_11='#5fff00'   # green
tmux_conf_theme_colour_12='#8a8a8a'   # light gray
tmux_conf_theme_colour_13='#e4e4e4'   # white
tmux_conf_theme_colour_14='#080808'   # dark gray
tmux_conf_theme_colour_15='#080808'   # dark gray
tmux_conf_theme_colour_16='#d70000'   # red
tmux_conf_theme_colour_17='#e4e4e4'   # white

# Status bar style
set -g status-style "fg=$tmux_conf_theme_colour_3,bg=$tmux_conf_theme_colour_1,none"

# Pane borders
set -g pane-border-style "fg=$tmux_conf_theme_colour_2,bg=default"
set -g pane-active-border-style "fg=$tmux_conf_theme_colour_4,bg=default"

# Window status
setw -g window-status-style "fg=$tmux_conf_theme_colour_3,bg=$tmux_conf_theme_colour_1,none"
setw -g window-status-current-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_4,bold"
setw -g window-status-format ' #I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} '
setw -g window-status-current-format ' #I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} '

# Message style
set -g message-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_5,bold"
set -g message-command-style "fg=$tmux_conf_theme_colour_5,bg=$tmux_conf_theme_colour_1,bold"

# Mode style (copy mode, etc)
setw -g mode-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_5,bold"

# Clock
setw -g clock-mode-colour "$tmux_conf_theme_colour_4"
setw -g clock-mode-style 24

# Status indicators
tmux_conf_theme_mouse='↗'                     # Mouse indicator symbol (U+2197)
tmux_conf_theme_prefix='⌨'                    # Prefix indicator symbol (U+2328)

# Status bar content with indicators
set -g status-left-length 1000
set -g status-right-length 1000

# Status left: session name
set -g status-left "#[fg=$tmux_conf_theme_colour_6,bg=$tmux_conf_theme_colour_9,bold] ❐ #S #[fg=$tmux_conf_theme_colour_9,bg=$tmux_conf_theme_colour_1,none]"

# Status right: indicators, battery, time, date, user, hostname  
set -g status-right "#{?client_prefix,#[fg=$tmux_conf_theme_colour_5]$tmux_conf_theme_prefix ,}#{?mouse,#[fg=$tmux_conf_theme_colour_4]$tmux_conf_theme_mouse ,}#[fg=$tmux_conf_theme_colour_15,bg=$tmux_conf_theme_colour_1,none]#[fg=$tmux_conf_theme_colour_12,bg=$tmux_conf_theme_colour_15,none] #(~/dotfile-tmux/scripts/battery/battery-status) #{?battery_percentage, #{battery_percentage},} #[fg=$tmux_conf_theme_colour_16,bg=$tmux_conf_theme_colour_15,none]#[fg=$tmux_conf_theme_colour_13,bg=$tmux_conf_theme_colour_16,none] %R #[fg=$tmux_conf_theme_colour_17,bg=$tmux_conf_theme_colour_16,none]#[fg=$tmux_conf_theme_colour_14,bg=$tmux_conf_theme_colour_17,bold] %d %b | #(~/dotfile-tmux/scripts/system/username) | #(~/dotfile-tmux/scripts/system/hostname) "

# Display panes
set -g display-panes-colour "$tmux_conf_theme_colour_4"
set -g display-panes-active-colour "$tmux_conf_theme_colour_4"