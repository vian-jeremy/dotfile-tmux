# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode # enter copy mode

# vi-style copy mode navigation
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Enhanced navigation in copy mode
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end
bind -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

# Mouse support for copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "tmux-clipboard-copy --copy-mode"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "tmux-clipboard-copy --copy-mode"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "tmux-clipboard-copy --copy-mode"

# Universal clipboard copy using custom script
bind y run -b "tmux-clipboard-copy"
# Copy selection in copy mode
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux-clipboard-copy --copy-mode"
# Copy with Enter key in copy mode
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "tmux-clipboard-copy --copy-mode"

# -- buffers -------------------------------------------------------------------

bind b list-buffers                     # list paste buffers
bind p run "tmux-clipboard-paste"       # paste from clipboard (system or file)
bind P choose-buffer                    # choose which buffer to paste from
bind C-p paste-buffer                   # paste most recent buffer
bind = choose-buffer                    # interactively choose buffer to paste

# Advanced buffer management
bind ] paste-buffer -p                  # paste and keep buffer
bind [ copy-mode                        # alternative copy mode entry
bind Space copy-mode                    # space to enter copy mode