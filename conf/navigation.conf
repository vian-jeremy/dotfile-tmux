# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# search the pane output with Ctrl+F (no prefix): copy mode + incremental search upward (sessions: prefix s)
bind -n C-f copy-mode \; command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""
# prefix Ctrl+F sends a real Ctrl+F to the program (shell, vim, less)
bind C-f send-keys C-f

# session navigation
bind BTab switch-client -l  # move to last session

# split current window: v = vertical divider (side by side), h = horizontal divider (stacked)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# pane navigation
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R
# same with Ctrl still held after the prefix (stock binding resizes)
bind -r C-Left  select-pane -L
bind -r C-Down  select-pane -D
bind -r C-Up    select-pane -U
bind -r C-Right select-pane -R
unbind j
unbind k
unbind l
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + run "~/dotfile-tmux/scripts/utils/maximize-pane '#{session_name}' '#D'"

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window                             # select previous window
bind -r C-l next-window                                 # select next window
bind -r C-S-H swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind -r C-S-L swap-window -t +1 \; select-window -t +1  # swap current window with the next one
bind Tab last-window                                    # move to last active window

# toggle mouse
bind m run "~/dotfile-tmux/scripts/utils/toggle-mouse"

# Quick clipboard operations
bind C-c run "tmux show-buffer | tmux-clipboard-copy --source-stdin"  # copy current buffer to system clipboard
bind C-v run "tmux-clipboard-paste"                                   # paste from system clipboard

# -- facebook pathpicker -------------------------------------------------------

bind F run "~/dotfile-tmux/scripts/tools/fpp '#{pane_id}' '#{pane_current_path}'"